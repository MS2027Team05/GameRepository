name: Check Code Format and Encoding

on:
  pull_request:

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.312' # 利用している.NETバージョンに合わせて変更可(一旦家のdesktopのものに合わせる)

      - name: Run BOM and .editorconfig Checks
        shell: pwsh
        run: |
          $targetBranch = "origin/${{ github.base_ref }}"
          $changedFiles = git diff --name-only --diff-filter=d $targetBranch HEAD -- "*.cs"

          if ([string]::IsNullOrWhiteSpace($changedFiles)) {
              Write-Host "変更された .cs ファイルはありません。チェックをスキップします。"
              exit 0
          }

          $fileList = ($changedFiles -split "`n") | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }
          $nonBomFiles = @()
          $formatFiles = @()

          # ─────────────────────────────────────────────────────────────
          # 1. BOM チェック
          # ─────────────────────────────────────────────────────────────
          Write-Host "=== 1. UTF-8 BOM チェック実行中 ==="
          foreach ($filePath in $fileList) {
              if (-not (Test-Path $filePath)) { continue }
              $bytes = Get-Content -AsByteStream -ReadCount 3 -TotalCount 3 -Path $filePath

              if ($null -eq $bytes -or $bytes.Length -lt 3 -or -not ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) {
                  $nonBomFiles += $filePath
              }
          }

          # ─────────────────────────────────────────────────────────────
          # 2. .editorconfig (dotnet format) 書式チェック
          # ─────────────────────────────────────────────────────────────
          Write-Host "=== 2. .editorconfig 基本書式(インデント・改行)チェック実行中 ==="
          # 即席のダミーcsprojを作成
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.1</TargetFramework>
              <Nullable>enable</Nullable>
              <NoWarn>CS0103;CS0246</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="UnityEngine.Modules" Version="2021.3.33" />
            </ItemGroup>
            <ItemGroup>
              <Compile Include="Assets/Scripts/**/*.cs" />
            </ItemGroup>
          </Project>
          "@ | Out-File -FilePath "DummyProject.csproj" -Encoding utf8

          dotnet restore DummyProject.csproj

          # dotnet format を実行し、修正が必要なファイルを検知
          dotnet format DummyProject.csproj style --severity info
          # 変更差分が出た（フォーマット違反があった）ファイルを取得
          $formattedChanges = git diff --name-only -- "Assets/Scripts/**/*.cs"
          if (-not [string]::IsNullOrWhiteSpace($formattedChanges)) {
              $formatFiles = ($formattedChanges -split "`n") | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }
              # ワーキングツリーの変更を元に戻す
              git checkout -- .
          }

          # ─────────────────────────────────────────────────────────────
          # 3. .editorconfig 命名規則チェック (フィールド m_、Enum E、Interface I、抽象クラス A)
          # ─────────────────────────────────────────────────────────────
          Write-Host "=== 3. .editorconfig 命名規則構文チェック実行中 ==="
          $namingErrors = @()

          foreach ($filePath in $fileList) {
              if (-not (Test-Path $filePath)) { continue }
              $normalizedPath = $filePath -replace '\\', '/'
              if ($normalizedPath -notmatch '^Assets/Scripts/') { continue }

              $lines = Get-Content -Path $filePath -Encoding utf8
              $inBlockComment = $false
              $lineNo = 0
              $pendingAttributes = @()

              foreach ($rawLine in $lines) {
                  $lineNo++
                  $trimmed = $rawLine.Trim()

                  # 複数行コメントのハンドリング
                  if ($inBlockComment) {
                      if ($trimmed -match '\*/') {
                          $trimmed = $trimmed -replace '^.*?\*/', ''
                          $inBlockComment = $false
                      } else {
                          continue
                      }
                  }
                  if ($trimmed -match '/\*') {
                      if ($trimmed -match '/\*.*?\*/') {
                          $trimmed = $trimmed -replace '/\*.*?\*/', ''
                      } else {
                          $trimmed = $trimmed -replace '/\*.*$', ''
                          $inBlockComment = $true
                      }
                  }

                  # 単一行コメントの除去
                  $codeLine = ($trimmed -replace '//.*$', '').Trim()
                  if ([string]::IsNullOrWhiteSpace($codeLine)) { continue }

                  # 属性行の検出 [SerializeField] など
                  if ($codeLine -match '^\[.*\]$') {
                      $pendingAttributes += $codeLine
                      continue
                  }

                  # 1. 抽象クラス定義: abstract class A...
                  if ($codeLine -match '\babstract\s+class\s+([A-Za-z0-9_]+)') {
                      $className = $Matches[1]
                      if ($className -notmatch '^A[A-Z][a-zA-Z0-9]*$') {
                          $namingErrors += [PSCustomObject]@{
                              File = $filePath
                              Line = $lineNo
                              Message = "抽象クラス名 '$className' は 'A' 接頭辞付きのPascalCaseである必要があります (例: A${className})"
                          }
                      }
                  }
                  # 2. インターフェース定義: interface I...
                  elseif ($codeLine -match '\binterface\s+([A-Za-z0-9_]+)') {
                      $ifName = $Matches[1]
                      if ($ifName -notmatch '^I[A-Z][a-zA-Z0-9]*$') {
                          $namingErrors += [PSCustomObject]@{
                              File = $filePath
                              Line = $lineNo
                              Message = "インターフェース名 '$ifName' は 'I' 接頭辞付きのPascalCaseである必要があります (例: I${ifName})"
                          }
                      }
                  }
                  # 3. Enum型定義: enum E...
                  elseif ($codeLine -match '\benum\s+([A-Za-z0-9_]+)') {
                      $enumName = $Matches[1]
                      if ($enumName -notmatch '^E[A-Z][a-zA-Z0-9]*$') {
                          $namingErrors += [PSCustomObject]@{
                              File = $filePath
                              Line = $lineNo
                              Message = "Enum型名 '$enumName' は 'E' 接頭辞付きのPascalCaseである必要があります (例: E${enumName})"
                          }
                      }
                  }
                  # 4. フィールド定義:
                  else {
                      $hasSerializeField = ($pendingAttributes -match 'SerializeField') -or ($codeLine -match '\[SerializeField\]')

                      if ($codeLine -match ';\s*$' -or $codeLine -match '=\s*[^>].*;\s*$') {
                          $isProperty = $codeLine -match '\{\s*(get|set|init)\b'
                          $isStatement = $codeLine -match '^(using|return|throw|break|continue|yield|base|this)\b'
                          $isConstant = $codeLine -match '\bconst\b'

                          if (-not $isProperty -and -not $isStatement -and -not $isConstant) {
                              if ($hasSerializeField -or ($codeLine -match '^\s*(private|protected|internal|public)\s+.*')) {
                                  if ($codeLine -match '(?:\[.*?\]\s*)*(?:private|protected|internal|public)?(?:\s+(?:readonly|volatile|static))*\s+[A-Za-z0-9_<>,\[\]\?]+\s+([A-Za-z0-9_]+)\s*(?:=|;)') {
                                      $varName = $Matches[1]
                                      if ($codeLine -notmatch '\bevent\b') {
                                          if ($varName -notmatch '^m_[A-Z][a-zA-Z0-9]*$') {
                                              $namingErrors += [PSCustomObject]@{
                                                  File = $filePath
                                                  Line = $lineNo
                                                  Message = "フィールド名 '$varName' は 'm_' 接頭辞付きのPascalCaseである必要があります (例: m_${varName})"
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }

                  # 属性バッファのリセット
                  $pendingAttributes = @()
              }
          }

          # ─────────────────────────────────────────────────────────────
          # 4. エラーの集約・PR画面表示・Discord通知準備
          # ─────────────────────────────────────────────────────────────
          $hasError = $false
          $discordDescription = ""
          $summaryContent = "# 🔍 コードチェック結果`n`n"

          # --- BOM エラー処理 ---
          if ($nonBomFiles.Count -gt 0) {
              $hasError = $true
              $summaryContent += "### ❌ UTF-8 (BOM付き) 違反`n以下のファイルが BOM付き で保存されていません:`n"
              $discordDescription += "**【UTF-8 (BOM) 違反ファイル】**`n"

              foreach ($file in $nonBomFiles) {
                  # line=1 を指定することでPRの「Files changed」差分の先頭に赤枠アノテーションを表示
                  Write-Host "::error file=$file,line=1,title=BOM Encoding Error::UTF-8 (BOM付き) で保存されていません。"
                  $summaryContent += "- ``$file```n"
                  $discordDescription += "• ``$file```n"
              }
              $discordDescription += "`n"
          }

          # --- Format エラー処理 ---
          if ($formatFiles.Count -gt 0) {
              $hasError = $true
              $summaryContent += "### ❌ .editorconfig 書式規約違反`n以下のファイルがインデントまたはフォーマット規約に違反しています:`n"
              $discordDescription += "**【.editorconfig 書式規約違反】**`n"

              foreach ($file in $formatFiles) {
                  Write-Host "::error file=$file,line=1,title=Format Rule Violation::.editorconfig の書式規約に違反しています。"
                  $summaryContent += "- ``$file```n"
                  $discordDescription += "• ``$file```n"
              }
              $discordDescription += "`n"
          }

          # --- Naming エラー処理 ---
          if ($namingErrors.Count -gt 0) {
              $hasError = $true
              $summaryContent += "### ❌ .editorconfig 命名規則違反`n以下の箇所が命名規則に違反しています:`n"
              $discordDescription += "**【.editorconfig 命名規則違反】**`n"

              foreach ($err in $namingErrors) {
                  Write-Host "::error file=$($err.File),line=$($err.Line),title=Naming Rule Violation::$($err.Message)"
                  $summaryContent += "- ``$($err.File):L$($err.Line)`` : $($err.Message)`n"
                  $discordDescription += "• ``$($err.File):L$($err.Line)`` : $($err.Message)`n"
              }
              $discordDescription += "`n"
          }

          # GitHub の PR画面（Job Summary）に結果を出力
          $summaryContent | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # Discord通知用の環境変数を保存
          if ($hasError) {
              "CHECK_ERROR_DETAILS<<EOF`n$discordDescription`nEOF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Error "コードチェックで違反が検知されました。"
              exit 1
          } else {
              Write-Host "すべてのチェックに合格しました！"
          }

      # ─────────────────────────────────────────────────────────────
      # 失敗時のみDiscordへ通知（BOM・Format・Naming の違反を掲載）
      # ─────────────────────────────────────────────────────────────
      - name: Notify Failure to Discord
        uses: sarisia/actions-status-discord@v1
        if: failure()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: "⚠️ PRのコードチェックに失敗しました"
          description: |
            以下のファイルに規約違反があります。修正して再度プッシュしてください。

            ${{ env.CHECK_ERROR_DETAILS }}
          nofail: true